name: Build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      previous:
        description: Stage whose tree is restored (0 for the first stage)
        required: true
        type: number
    outputs:
      finished:
        description: "'true' when chrome finished building in this stage"
        value: ${{ jobs.build.outputs.finished }}

env:
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: 1
  # Short root: Chromium paths get long. D: is the runner drive with space.
  ROOT: D:\c
  # Minutes after job start at which the build is interrupted, leaving time
  # to archive and upload the tree before the 6-hour job limit.
  BUILD_DEADLINE_MINUTES: 235

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record job start
        run: |
          "JOB_START=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, @{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}}

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Git settings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global advice.detachedHead false

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" >> $env:GITHUB_PATH
          # First use bootstraps depot_tools' own python and git.
          $env:Path = "C:\depot_tools;$env:Path"
          cmd /c "gclient --version"

      - name: Install Windows SDK 10.0.28000
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0\um"
          if (-not (Test-Path $inc)) {
            # winget's own silent install of this package fails with
            # E_INVALIDARG, so download the installer and run it directly.
            winget download --id Microsoft.WindowsSDK.10.0.28000 --source winget -d D:\sdk --accept-package-agreements --accept-source-agreements --disable-interactivity
            $setup = Get-ChildItem D:\sdk -Filter *.exe | Select-Object -First 1
            if (-not $setup) { throw "SDK installer was not downloaded" }
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/features', '+', '/quiet', '/norestart', '/log', 'D:\sdk\install.log' -Wait -PassThru
            Write-Host "SDK installer exit code: $($p.ExitCode)"
            if (-not (Test-Path $inc)) { Get-ChildItem D:\sdk; Get-Content D:\sdk\install.log -Tail 40 -ErrorAction SilentlyContinue }
          }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Select-Object Name
          if (-not (Test-Path $inc)) { throw "Windows SDK 10.0.28000.0 is not installed" }

      # Cross-run cache: the first stage starts from the most recent tree
      # uploaded by an earlier run (finished, interrupted or failed), as long
      # as it was built from the same Chromium commit. Only files whose
      # patched content changed are then recompiled.
      - name: Restore tree from an earlier run
        id: cache
        if: inputs.stage == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $restored = 'false'
          try {
            $commit = (Get-Content repo\chromium_commit.txt -Raw).Trim()
            $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | {id, name, expired, created_at, run_id: .workflow_run.id}]' | ConvertFrom-Json
            $artifact = $artifacts |
              Where-Object { $_.name -like 'build-state-*' -and -not $_.expired -and "$($_.run_id)" -ne $env:GITHUB_RUN_ID } |
              Sort-Object created_at -Descending | Select-Object -First 1
            if (-not $artifact) { throw "no earlier build state found" }
            Write-Host "Restoring $($artifact.name) from run $($artifact.run_id)"
            gh run download $artifact.run_id --repo $env:GITHUB_REPOSITORY -n $artifact.name -D D:\state
            if ($LASTEXITCODE -ne 0) { throw "download failed" }
            New-Item -ItemType Directory -Force $env:ROOT | Out-Null
            7z x D:\state\state.7z "-o$env:ROOT" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "extract failed" }
            Remove-Item -Recurse -Force D:\state
            $cached = if (Test-Path "$env:ROOT\cache_commit.txt") { (Get-Content "$env:ROOT\cache_commit.txt" -Raw).Trim() } else { '' }
            if ($cached -ne $commit) { throw "cached tree is for commit '$cached', need '$commit'" }
            & repo\scripts\update_patches.ps1 -Root $env:ROOT -NewPatches "$env:GITHUB_WORKSPACE\repo\patches"
            $restored = 'true'
          } catch {
            Write-Host "Not using a cached tree: $_"
            foreach ($path in $env:ROOT, 'D:\state') {
              if (Test-Path $path) { cmd /c "rmdir /s /q `"$path`"" }
            }
          }
          "restored=$restored" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Fetch Chromium and apply patches
        if: inputs.stage == 1 && steps.cache.outputs.restored != 'true'
        run: |
          $commit = (Get-Content repo\chromium_commit.txt -Raw).Trim()
          New-Item -ItemType Directory -Force $env:ROOT | Out-Null
          Set-Location $env:ROOT
          git init -q src
          Set-Location src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git fetch --depth 1 origin $commit
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout -q FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          Set-Location $env:ROOT
          @'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          '@ | Set-Content -Encoding ascii .gclient
          cmd /c "gclient sync --no-history -D"
          if ($LASTEXITCODE -ne 0) { throw "gclient sync failed" }
          Set-Location src
          Get-ChildItem "$env:GITHUB_WORKSPACE\repo\patches\*.patch" | Sort-Object Name | ForEach-Object {
            Write-Host "Applying $($_.Name)"
            git apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "failed to apply $($_.Name)" }
          }
          # Recorded so that a later run can reuse this tree as a cache.
          Set-Content -Encoding ascii "$env:ROOT\cache_commit.txt" $commit
          New-Item -ItemType Directory -Force "$env:ROOT\applied_patches" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\repo\patches\*.patch" "$env:ROOT\applied_patches"

      - name: Download previous stage
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: build-state-${{ inputs.previous }}
          path: D:\state

      - name: Restore previous stage
        if: inputs.stage > 1
        run: |
          New-Item -ItemType Directory -Force $env:ROOT | Out-Null
          7z x D:\state\state.7z "-o$env:ROOT" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "extract failed" }
          Remove-Item -Recurse -Force D:\state

      - name: Generate build files
        if: inputs.stage == 1
        run: |
          Set-Location "$env:ROOT\src"
          New-Item -ItemType Directory -Force out\Release | Out-Null
          $args_new = Get-Content "$env:GITHUB_WORKSPACE\repo\args.gn" -Raw
          $args_old = if (Test-Path out\Release\args.gn) { Get-Content out\Release\args.gn -Raw } else { '' }
          if ($args_new -ne $args_old) {
            Copy-Item "$env:GITHUB_WORKSPACE\repo\args.gn" out\Release\args.gn
          }
          cmd /c "gn gen out\Release"
          if ($LASTEXITCODE -ne 0) { throw "gn gen failed" }

      - name: Build
        id: build
        run: |
          Set-Location "$env:ROOT\src"
          $deadline = ([datetime]::Parse($env:JOB_START)).ToUniversalTime().AddMinutes([int]$env:BUILD_DEADLINE_MINUTES)
          $log = "$env:ROOT\build.log"
          $p = Start-Process -FilePath cmd -ArgumentList '/c', "autoninja -C out\Release chrome > `"$log`" 2>&1" -PassThru -NoNewWindow
          $null = $p.Handle
          $tick = 0
          while (-not $p.HasExited -and (Get-Date).ToUniversalTime() -lt $deadline) {
            Start-Sleep -Seconds 30
            $tick++
            if ($tick % 10 -eq 0 -and (Test-Path $log)) {
              Get-Content $log -Tail 2
            }
          }
          if (-not $p.HasExited) {
            Write-Host "Time budget reached; interrupting the build."
            taskkill /PID $p.Id /T /F | Out-Null
            foreach ($name in 'siso.exe', 'ninja.exe', 'clang-cl.exe', 'lld-link.exe') {
              taskkill /IM $name /F 2>$null | Out-Null
            }
            Start-Sleep -Seconds 10
            "finished=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) {
            Write-Host "Build failed with exit code $($p.ExitCode)"
            Select-String -Path $log -Pattern 'error:|FAILED:' -Context 0, 12 | Select-Object -First 40 | ForEach-Object { $_.ToString() }
            Get-Content $log -Tail 60
            "finished=failed" >> $env:GITHUB_OUTPUT
            exit 1
          }
          "finished=true" >> $env:GITHUB_OUTPUT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.stage }}
          path: D:\c\build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package chrome
        if: steps.build.outputs.finished == 'true'
        run: |
          $out = "$env:ROOT\src\out\Release"
          $dst = "D:\pkg\chrome"
          New-Item -ItemType Directory -Force $dst | Out-Null
          $patterns = 'chrome.exe', 'chrome_proxy.exe', 'chrome_pwa_launcher.exe', 'elevation_service.exe', 'notification_helper.exe', '*.dll', '*.pak', '*.bin', '*.dat', '*.manifest', '*.json'
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $out -Filter $pattern -File | Copy-Item -Destination $dst
          }
          foreach ($dir in 'locales', 'MEIPreload', 'PrivacySandboxAttestationsPreloaded', 'IwaKeyDistribution') {
            if (Test-Path "$out\$dir") { Copy-Item -Recurse "$out\$dir" "$dst\$dir" }
          }
          7z a -tzip D:\pkg\chrome-win64.zip "$dst" -bso0 -bsp0
          "{0:N1} MB" -f ((Get-Item D:\pkg\chrome-win64.zip).Length / 1MB)

      - name: Upload chrome
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-win64
          path: D:\pkg\chrome-win64.zip
          compression-level: 0
          retention-days: 14

      # The tree is uploaded whatever the outcome: an interrupted build hands
      # it to the next stage, and a finished or failed one leaves it as the
      # cache for the next run.
      - name: Archive tree
        if: always() && steps.build.outputs.finished != ''
        run: |
          Set-Location $env:ROOT
          7z a -t7z -mx=1 -mmt=on D:\state.7z src .gclient .gclient_entries cache_commit.txt applied_patches "-xr!.git" -bso0 -bsp0
          if ($LASTEXITCODE -gt 1) { throw "archive failed" }
          "{0:N1} GB" -f ((Get-Item D:\state.7z).Length / 1GB)

      - name: Upload tree
        if: always() && steps.build.outputs.finished != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-state-${{ inputs.stage }}
          path: D:\state.7z
          compression-level: 0
          retention-days: 5
